[workspace]
resolver = "2"
members = [
  "crates/docspec",
  "crates/docspec-core",
  "crates/docspec-docx-reader",
  "crates/docspec-html-reader",
  "crates/docspec-html-writer",
  "crates/docspec-markdown-reader",
  "crates/docspec-blocknote-writer",
  "crates/docspec-json",
  "crates/docspec-cli",
  "crates/docspec-http",
  "crates/docspec-oxa-writer",
  "crates/docspec-wasm",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/docspec/docspec"

[workspace.dependencies]
docspec = { path = "crates/docspec", version = "2.0.0" }
docspec-core = { path = "crates/docspec-core", version = "2.0.0" }
docspec-json = { path = "crates/docspec-json", version = "2.0.0" }
docspec-markdown-reader = { path = "crates/docspec-markdown-reader", version = "2.0.0" }
docspec-html-reader = { path = "crates/docspec-html-reader", version = "2.0.0" }
docspec-docx-reader = { path = "crates/docspec-docx-reader", version = "2.0.0" }
docspec-blocknote-writer = { path = "crates/docspec-blocknote-writer", version = "2.0.0" }
docspec-html-writer = { path = "crates/docspec-html-writer", version = "2.0.0" }
docspec-oxa-writer = { path = "crates/docspec-oxa-writer", version = "2.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
# Reason: Public functions in docspec-cli format module are intentionally exposed for use by future tasks (e.g., T9 uses resolve_input_format and resolve_output_format)
dead_code = "allow"

[workspace.lints.clippy]
# Verified against clippy 0.1.92 (2025-12-08)
# Groups at priority -1 so individual allows (priority 0) override

# --- Existing explicit denials (kept for clarity) ---
unwrap_used = "deny"
expect_used = "deny"
# Reason: Test files (tests/**) opt out of `unwrap_used` / `expect_used`
# via crate-level `#![allow(...)]`. Production code remains strictly enforced.
allow_attributes = "allow"

# --- Promote default-warn groups to deny ---
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# --- Enable opt-in groups at deny ---
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# --- Nursery cherry-picks (individually selected per official guidance) ---
cognitive_complexity = "deny"
option_if_let_else = "deny"
redundant_pub_crate = "deny"
use_self = "deny"

# --- Selective allows: restriction group (idiomatic Rust conflicts) ---
# Reason: We deliberately enable the restriction group; this meta-lint warns against that
blanket_clippy_restriction_lints = "allow"
# Reason: Implicit return is idiomatic Rust; explicit return is only for early returns
implicit_return = "allow"
# Reason: ? operator is Rust's standard error propagation (CODING_STANDARDS.md mandates it)
question_mark_used = "allow"
# Reason: 'a, 'b are standard Rust lifetime conventions per The Rust Book
single_char_lifetime_names = "allow"
# Reason: Short variable names (i, n, s) appropriate in iterators, closures, small scopes
min_ident_chars = "allow"
# Reason: Standard imports preferred; absolute paths make code verbose and unreadable
absolute_paths = "allow"
# Reason: We use mod.rs style per CODING_STANDARDS.md
mod_module_files = "allow"
# Reason: Default trait implementations are intentional and valid
missing_trait_methods = "allow"
# Reason: Match ergonomics (binding modes) are idiomatic Rust since edition 2018
pattern_type_mismatch = "allow"
# Reason: Separate impl blocks for grouping related methods improves readability
multiple_inherent_impl = "allow"
# Reason: Reasons live in dedicated `# Reason:` comments above each lint setting,
# not inline in the attribute; this lint is too noisy and conflicts with that style
allow_attributes_without_reason = "allow"

# --- Selective allows: restriction group (practicality) ---
# Reason: Non-exhaustive enums require wildcard catch-all arms from downstream crates;
# listing every known variant explicitly creates maintenance burden and defeats the
# purpose of #[non_exhaustive].
wildcard_enum_match_arm = "allow"
# Reason: let x = x.trim() is idiomatic Rust transformation via shadowing
shadow_same = "allow"
# Reason: Too noisy; numeric types clear from context
default_numeric_fallback = "allow"
# Reason: Targeting embedded — prefer core/alloc over std where possible
std_instead_of_core = "warn"
alloc_instead_of_core = "warn"
# Reason: std crates should use std paths where clearer than alloc aliases
std_instead_of_alloc = "allow"
# Reason: Public docs enforced by missing_docs = "deny"; private doc requirement too noisy
missing_docs_in_private_items = "allow"
# Reason: Mixed pub/private field visibility is normal Rust pattern
partial_pub_fields = "allow"
# Reason: let _ = expr is standard discard pattern; type annotation adds noise
let_underscore_untyped = "allow"
# Reason: .to_string() is more readable than .to_owned() in many contexts
str_to_string = "allow"
# Reason: Both semicolon positions are valid Rust; no strong convention
semicolon_inside_block = "allow"
# Reason: Division and remainder are fundamental operations; banning them is impractical
integer_division_remainder_used = "allow"
# Reason: Document format parsing legitimately needs endian-specific byte operations
big_endian_bytes = "allow"
little_endian_bytes = "allow"
host_endian_bytes = "allow"
# Reason: #[cfg(not(test))] is occasionally needed for test-only code paths
cfg_not_test = "allow"
# Reason: Large decimal literals are often clearer than hex for human-readable values
decimal_literal_representation = "allow"
# Reason: Standard re-export pattern in Rust libraries (pub use in lib.rs)
pub_use = "allow"
# Reason: Early process startup failures may need stderr before tracing is initialized
print_stderr = "allow"
# Reason: Telemetry init helpers are intentionally factored for testability
single_call_fn = "allow"

# --- Selective allows: library API design (reassess at 1.0) ---
# Reason: Event enum must be exhaustive for downstream pattern matching. Reassess at 1.0.
exhaustive_enums = "allow"
# Reason: Public structs are intentionally exhaustive for construction. Reassess at 1.0.
exhaustive_structs = "allow"

# --- Selective allows: pedantic group ---
# Reason: Names like event::EventType and error::ErrorKind are standard Rust patterns
module_name_repetitions = "allow"
# Reason: Naming a crate error type `Error` is the standard Rust convention; renaming breaks public API
error_impl_error = "allow"
# Reason: Test code must assert on Results; unwrap_used is forbidden, assert!(x.is_ok()) is the only option
assertions_on_result_states = "allow"

# --- Selective allows: cargo group ---
# Reason: Transitive dependency version conflicts are not directly controllable
multiple_crate_versions = "allow"

# --- Selective allows: pedantic group (continued) ---
# Reason: Some internal helpers may use multiple bool parameters for clarity over struct wrapping.
fn_params_excessive_bools = "allow"
# Reason: Callback trait contracts may require Option return even when current implementation always keeps values.
unnecessary_wraps = "allow"

# --- Selective allows: perf group (continued) ---
# Reason: AnyReader enum variants (HtmlReader, MarkdownReader) are large but must be stack-allocated for zero heap allocation and zero virtual-dispatch overhead per MANIFESTO.md. Boxing would violate the design constraint.
large_enum_variant = "allow"

[workspace.metadata.dist]
# Cargo-dist version
cargo-dist-version = "0.32.0"

# Allow dirty state (workflow file is auto-generated)
allow-dirty = ["ci"]

# CI provider
ci = ["github"]

# Build targets (standard Rust CLI platforms, 2026)
targets = [
  # Linux
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  
  # macOS
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  
  # Windows
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

# Installers to generate
installers = ["shell", "powershell"]

# Archive format
windows-archive = ".zip"
unix-archive = ".tar.xz"

# Checksum algorithm
checksum = "sha256"

# Build settings
build-local = false
local-artifacts-archive = ".tar.xz"

# Publish settings
publish-prereleases = false

# Announcement settings
announce-in-tag = true

