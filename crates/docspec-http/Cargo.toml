[package]
name = "docspec-http"
version = "2.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "HTTP API server for DocSpec document conversion"
keywords = ["document", "conversion", "streaming", "http", "api"]
categories = ["network-programming", "web-programming"]

[[bin]]
name = "docspec-http"
path = "src/bin/docspec-http.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
] }
tower = "0.5"
tower-http = { version = "0.6", features = [
  "limit",
  "trace",
  "request-id",
  "util",
  "set-header",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
mime = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
thiserror = "2"
sentry = { version = "0.48", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "tower",
  "tower-http",
  "tracing",
  "reqwest",
  "rustls",
] }
docspec-core = { path = "../docspec-core", version = "1.0.0" }
docspec-json = { path = "../docspec-json", version = "1.0.0" }
docspec = { path = "../docspec", version = "2.0.0", features = [
  "docx",
  "markdown",
  "html",
  "blocknote",
  "oxa",
  "html-writer",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
uuid = "1"
docspec-test-fixtures = { path = "../docspec-test-fixtures" }
sentry = { version = "0.48", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "tower",
  "tower-http",
  "tracing",
  "reqwest",
  "rustls",
  "test",
] }

[lints]
workspace = true
