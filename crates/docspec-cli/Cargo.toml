[package]
name = "docspec-cli"
version = "1.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Command-line interface for DocSpec document conversion"
keywords = ["document", "conversion", "streaming", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "docspec"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
docspec-core = { path = "../docspec-core", version = "1.0.0" }
docspec-markdown-reader = { path = "../docspec-markdown-reader", version = "1.0.0" }
docspec-blocknote-writer = { path = "../docspec-blocknote-writer", version = "1.0.0" }
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
clap_complete = "4"

[lints]
workspace = true
