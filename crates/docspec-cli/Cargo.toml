[package]
name = "docspec-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Command-line interface for DocSpec document conversion"
keywords = ["document", "conversion", "streaming", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "docspec"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color", "env"] }
docspec-blocknote-writer = { path = "../docspec-blocknote-writer" }
docspec-core = { path = "../docspec-core" }
docspec-http = { path = "../docspec-http" }
docspec-markdown-reader = { path = "../docspec-markdown-reader" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2"
nix = { version = "0.29", features = ["signal"] }
predicates = "3"
serde_json = "1"
tempfile = "3"

[build-dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_mangen = "0.2"
clap_complete = "4"

[lints]
workspace = true
