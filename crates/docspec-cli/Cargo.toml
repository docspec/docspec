[package]
name = "docspec-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Command-line interface for DocSpec document conversion"
keywords = ["document", "conversion", "streaming", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "docspec"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
docspec = { workspace = true, features = ["full"] }
docspec-core = { workspace = true }
docspec-http = { workspace = true, optional = true }
thiserror = "2"

[features]
default = ["http"]
http = ["dep:docspec-http"]
posthog = ["http", "docspec-http/posthog"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
] }
docspec-test-utils = { workspace = true }

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
clap_complete = "4"

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.xz"
bin-dir = "{ bin }{ binary-ext }"
