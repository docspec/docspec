[package]
name = "docspec-docx-reader"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "DOCX to DocSpec event stream reader"
keywords = ["document", "conversion", "streaming", "docx"]
categories = ["parsing"]

[dependencies]
docspec-core = { path = "../docspec-core" }
quick-xml = { version = "0.37", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
