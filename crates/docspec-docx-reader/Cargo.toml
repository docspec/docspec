[package]
name = "docspec-docx-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "DOCX to DocSpec event stream reader"
keywords = ["document", "conversion", "streaming", "docx"]
categories = ["parsing"]
exclude = ["tests/fixtures/**", "tests/snapshots/**"]

[dependencies]
docspec-core = { workspace = true }
quick-xml = "0.40"
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"

[dev-dependencies]
docspec-blocknote-writer = { workspace = true }
serde_json = "1"
zip = { version = "8", default-features = false, features = [
  "deflate",
  "bzip2",
] }
tempfile = "3"
docspec-test-utils = { workspace = true }
insta = { version = "1", features = ["glob"] }

[lints]
workspace = true
