[package]
name = "docspec-docx-reader"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "DOCX to DocSpec event stream reader"
keywords = ["document", "conversion", "streaming", "docx"]
categories = ["parsing"]

[dependencies]
docspec-core = { path = "../docspec-core", version = "1.0.0" }
quick-xml = "0.40"
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"

[dev-dependencies]
docspec-test-fixtures = { path = "../docspec-test-fixtures" }
zip = { version = "8", default-features = false, features = ["deflate", "bzip2"] }
tempfile = "3"

[lints]
workspace = true
