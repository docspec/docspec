[package]
name = "docspec-blocknote-writer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "DocSpec event stream to BlockNote JSON writer"
keywords = ["document", "conversion", "streaming"]
categories = ["encoding"]

[dependencies]
base64 = "0.22"
docspec-core = { workspace = true }
docspec-json = { workspace = true }

[dev-dependencies]
docspec-test-utils = { workspace = true }
# Used only in the sample.docx end-to-end integration test (sample_docx_lifts_list_from_requirements_cell).
# A dev-only dep keeps it out of the published crate's runtime dependency graph.
docspec-docx-reader = { path = "../docspec-docx-reader" }
paste = "1"
serde_json = "1"

[lints]
workspace = true
