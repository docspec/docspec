[package]
name = "docspec-wasm"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the DocSpec document conversion library."
readme = "README.md"
keywords = ["document", "conversion", "streaming", "wasm"]
categories = ["encoding", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["markdown-reader", "blocknote-writer"]

docx-reader = ["docspec/docx"]
html-reader = ["docspec/html"]
markdown-reader = ["docspec/markdown"]

blocknote-writer = ["docspec/blocknote-writer"]
html-writer = ["docspec/html-writer"]
markdown-writer = ["docspec/markdown-writer"]
oxa-writer = ["docspec/oxa-writer"]
pandoc-native-writer = ["docspec/pandoc-native-writer"]

docx = ["docx-reader"]
html = ["html-reader", "html-writer"]
markdown = ["markdown-reader", "markdown-writer"]
blocknote = ["blocknote-writer"]
oxa = ["oxa-writer"]
pandoc-native = ["pandoc-native-writer"]

all-readers = ["docx-reader", "html-reader", "markdown-reader"]
all-writers = [
  "blocknote-writer",
  "html-writer",
  "markdown-writer",
  "oxa-writer",
  "pandoc-native-writer",
]
full = ["all-readers", "all-writers"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
docspec-core = { workspace = true }
docspec = { workspace = true, default-features = false }

[dev-dependencies]
docspec-test-utils = { workspace = true }
serde_json = "1"

# Pins wasm-opt so the artifact does not silently change if wasm-pack alters its
# defaults. The table key MUST be `custom`, not the profile name: wasm-pack maps
# every `--profile <name>` to BuildProfile::Custom and reads
# `metadata.wasm_pack.profile.custom` (wasm-pack 0.14.0, manifest/mod.rs:539).
# A `[...profile.wasm-release]` table is accepted and then silently ignored --
# there is no deny_unknown_fields on the profile table.
#
# Reason for -O over -Oz, despite the cargo profile's opt-level = "z": measured
# on the `full` package, -Oz trades 24,415 raw bytes (-2.5%) for LARGER
# compressed transfers -- gzip -9 348,520 -> 351,136 and brotli -q11
# 268,440 -> 270,320. Users pay the compressed size on every load, so -O wins.
# -Os and -O3 measured no better than -O on any axis. Re-measure before changing.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-O"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
# Reason: wasm-bindgen exported functions cannot be inlined
missing_inline_in_public_items = "allow"
# Inherit all other workspace clippy lints
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
option_if_let_else = "deny"
redundant_pub_crate = "allow"
use_self = "deny"
blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"
question_mark_used = "allow"
single_char_lifetime_names = "allow"
min_ident_chars = "allow"
absolute_paths = "allow"
mod_module_files = "allow"
missing_trait_methods = "allow"
pattern_type_mismatch = "allow"
multiple_inherent_impl = "allow"
allow_attributes_without_reason = "allow"
shadow_same = "allow"
default_numeric_fallback = "allow"
std_instead_of_core = "warn"
alloc_instead_of_core = "warn"
std_instead_of_alloc = "warn"
# Reason: `#[cfg(test)] mod tests { ... }` is idiomatic Rust for co-locating unit tests
# with their target module; splitting each into a separate file adds churn without value.
inline_modules = "allow"
missing_docs_in_private_items = "allow"
partial_pub_fields = "allow"
let_underscore_untyped = "allow"
str_to_string = "allow"
semicolon_inside_block = "allow"
integer_division_remainder_used = "allow"
big_endian_bytes = "allow"
little_endian_bytes = "allow"
host_endian_bytes = "allow"
cfg_not_test = "allow"
decimal_literal_representation = "allow"
pub_use = "allow"
exhaustive_enums = "deny"
exhaustive_structs = "allow"
module_name_repetitions = "allow"
error_impl_error = "allow"
multiple_crate_versions = "allow"
as_conversions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
pub_with_shorthand = "allow"
single_call_fn = "allow"
