[package]
name = "docspec"
version = "1.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Streaming document conversion: convenience facade re-exporting readers, writers, and event types"
keywords = ["document", "conversion", "streaming"]
categories = ["parsing", "encoding"]

[features]
# No features are enabled by default. Opt into the readers and writers you need.
default = []

# Format readers (event sources).
markdown = ["dep:docspec-markdown-reader"]

# Format writers (event sinks).
blocknote = ["dep:docspec-blocknote-writer"]

# Lower-level primitives for implementing custom writers.
json = ["dep:docspec-json"]

# Convenience meta-features.
all-readers = ["markdown"]
all-writers = ["blocknote"]
full = ["all-readers", "all-writers", "json"]

[dependencies]
docspec-core = "1.0.0"
docspec-json = { version = "1.0.0", optional = true }
docspec-markdown-reader = { version = "1.0.0", optional = true }
docspec-blocknote-writer = { version = "1.0.0", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
