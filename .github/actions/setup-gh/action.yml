name: Set up GitHub CLI
description: >-
  Installs the GitHub CLI into the job's temp directory. release-plz/action
  calls `gh`, which the 9xx runner image does not ship and cannot apt-install
  (no sudo).

runs:
  using: composite
  steps:
    - name: Install gh
      shell: bash
      env:
        GH_VERSION: 2.103.3
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=amd64; sha256=4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d ;;
          aarch64) arch=arm64; sha256=ee32df2323c8847f5fac6cb6b4b69ca75828e9329a8f22f677021f7b3306ce63 ;;
          *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        name="gh_${GH_VERSION}_linux_${arch}"
        curl --fail --location --show-error --silent \
          --output "${RUNNER_TEMP}/${name}.tar.gz" \
          "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${name}.tar.gz"
        echo "${sha256}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum --check --strict
        tar --extract --gzip --file "${RUNNER_TEMP}/${name}.tar.gz" --directory "${RUNNER_TEMP}"
        echo "${RUNNER_TEMP}/${name}/bin" >> "$GITHUB_PATH"
