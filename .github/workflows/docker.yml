name: Docker

on:
  workflow_call:
    inputs:
      push:
        description: "Whether to push the built image to GHCR"
        type: boolean
        default: false
      sign:
        description: "Whether to sign the pushed image with cosign (requires push=true)"
        type: boolean
        default: false
      ref:
        description: "Git ref to check out. Empty = the SHA that triggered the calling workflow."
        type: string
        default: ""
      tag_name:
        description: "Release tag used for image tagging when push=true (e.g. v1.2.3)"
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        if: inputs.push
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/docspec/api
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag_name, '-') }}
          labels: |
            org.opencontainers.image.title=docspec-http
            org.opencontainers.image.description=HTTP API server for DocSpec markdown to BlockNote JSON conversion
            org.opencontainers.image.source=https://github.com/docspec/docspec
            org.opencontainers.image.licenses=MIT

      - name: Verify resolved version is non-empty
        if: inputs.push
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "ERROR: docker/metadata-action produced empty version (tag_name=${TAG_NAME})" >&2
            exit 1
          fi
          echo "Building image version: ${VERSION}"

      - name: Build${{ inputs.push && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ inputs.push && steps.meta.outputs.version || 'ci-validation' }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.0"

      - name: Sign the image
        if: inputs.sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/docspec/api@${DIGEST}"
