name: Publish crates

on:
  workflow_call:
    inputs:
      paths_released:
        description: "JSON array of crate paths released by release-please (e.g. [\"crates/docspec-core\"])"
        required: true
        type: string
      ref:
        description: "Git ref to publish from (e.g. a release tag). Empty = caller commit."
        required: false
        type: string
        default: ""
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      paths_released:
        description: "JSON array of crate paths to publish (e.g. [\"crates/docspec-core\",\"crates/docspec-json\"])"
        required: true
        type: string
      ref:
        description: "Git ref to publish from. Empty = default branch."
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish released crates in topological order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PATHS_RELEASED: ${{ inputs.paths_released }}
        run: |
          set -euo pipefail

          # Topological order including dev-deps. docspec-wasm has publish=false
          # in its Cargo.toml so it never appears here even if release-please
          # bumped its version.
          ORDER=(
            "crates/docspec-core"
            "crates/docspec-json"
            "crates/docspec-markdown-reader"
            "crates/docspec-blocknote-writer"
            "crates/docspec-cli"
            "crates/docspec-http"
            "crates/docspec"
          )

          mapfile -t RELEASED < <(echo "$PATHS_RELEASED" | jq -r '.[]')

          printf 'Released paths:\n'
          printf '  %s\n' "${RELEASED[@]}"

          for path in "${ORDER[@]}"; do
            skip=true
            for r in "${RELEASED[@]}"; do
              if [ "$r" = "$path" ]; then
                skip=false
                break
              fi
            done
            if $skip; then
              continue
            fi

            pkg=$(basename "$path")
            echo "::group::Publishing $pkg"
            # --no-verify: skip the local build verification step. Without it,
            # cargo tries to resolve all deps (including dev-deps) against
            # crates.io, which fails for first-time workspace publishes where
            # sibling crates were just published seconds ago and the index has
            # not propagated yet.
            cargo publish -p "$pkg" --no-verify
            echo "::endgroup::"

            # Give the crates.io sparse index time to surface the just-published
            # version before the next sibling crate references it.
            sleep 30
          done
