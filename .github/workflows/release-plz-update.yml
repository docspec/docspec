name: Release-plz update

on:
  push:
    branches: [main]

# release-plz needs to open a PR and push to its own branch
permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz-pr:
    name: Open / update release PR
    runs-on: ubuntu-latest
    # Prevent concurrent runs from racing each other on the same release PR
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    # Only run on the upstream repo, not on forks
    if: github.repository == 'docspec/docspec'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
