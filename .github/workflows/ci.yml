name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  docker-build:
    name: Docker Build
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    with:
      push: false

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, clippy, fmt, docker-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      docspec_http_released: ${{ steps.release.outputs['crates/docspec-http--release_created'] }}
      docspec_http_tag: ${{ steps.release.outputs['crates/docspec-http--tag_name'] }}
      docspec_http_version: ${{ steps.release.outputs['crates/docspec-http--version'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  crates-release:
    name: Crates.io Release
    needs: release-please
    if: needs.release-please.outputs.paths_released != '' && needs.release-please.outputs.paths_released != '[]'
    uses: ./.github/workflows/publish-crates.yml
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    with:
      paths_released: ${{ needs.release-please.outputs.paths_released }}

  docker-release:
    name: Docker Release
    needs: release-please
    if: needs.release-please.outputs.docspec_http_released == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
    uses: ./.github/workflows/docker.yml
    with:
      push: true
      sign: true
      ref: ${{ needs.release-please.outputs.docspec_http_tag }}
      tag_name: ${{ needs.release-please.outputs.docspec_http_version }}
