name: Release-plz release

on:
  push:
    branches: [main]

permissions:
  contents: write       # create git tag + GitHub Release
  pull-requests: read   # detect merged release PR (release_always = false in release-plz.toml)
  id-token: write       # OIDC for crates.io Trusted Publishing

jobs:
  release-plz-release:
    name: Tag and publish crates
    runs-on: ubuntu-latest
    # Bind to the `release` GitHub environment (created by maintainers).
    # This allows future addition of secrets / branch protection without
    # changing the workflow. No approval gate is configured (per plan §6).
    environment: release
    # Idempotent if the release PR is merged twice or this workflow is re-run.
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    if: github.repository == 'docspec/docspec'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Wrap in a retry to absorb crates.io index propagation lag between
      # dependent crate publishes (e.g., docspec-core must be visible before
      # docspec can publish). See plan §6 / Metis gap 6.2.
      - name: Run release-plz (release) with retry
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            cargo install --locked release-plz --version "0.3"
            release-plz release --config release-plz.toml --git-token "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted Publishing (OIDC) is the only auth path — release-plz
          # mints a short-lived token from crates.io via the workflow's
          # id-token: write permission. No long-lived secret is needed.
