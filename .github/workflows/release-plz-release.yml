name: Release-plz release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write       # create git tag + GitHub Release
  pull-requests: read   # detect merged release PR (release_always = false in release-plz.toml)
  id-token: write       # OIDC for crates.io Trusted Publishing and cosign
  packages: write       # push Docker image to GHCR
  attestations: write   # publish Docker provenance
  actions: write        # allow Docker build cache writes

jobs:
  release-plz-release:
    name: Tag and publish crates
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      release_tag: ${{ steps.release-tag.outputs.tag }}
    # Bind to the `release` GitHub environment (created by maintainers).
    # This allows future addition of secrets / branch protection without
    # changing the workflow. No approval gate is configured (per plan §6).
    environment: release
    # Idempotent if the release PR is merged twice or this workflow is re-run.
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.repository == 'docspec/docspec'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: dtolnay/rust-toolchain@stable

      # Trusted Publishing (OIDC) is the only auth path — release-plz
      # mints a short-lived token from crates.io via the workflow's
      # id-token: write permission. No long-lived secret is needed.
      - name: Run release-plz (release)
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release tag for Docker publish
        id: release-tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag=$(jq -r 'map(select(.package_name == "docspec"))[0].tag // .[0].tag // empty' <<<"${RELEASES}")
          if [ -z "${tag}" ]; then
            echo "release-plz reported a release but no release tag was found" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  docker:
    name: Publish Docker image
    needs: release-plz-release
    if: needs.release-plz-release.outputs.releases_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: write
    uses: ./.github/workflows/docker.yml
    with:
      push: true
      sign: true
      ref: ${{ needs.release-plz-release.outputs.release_tag }}
      tag_name: ${{ needs.release-plz-release.outputs.release_tag }}
