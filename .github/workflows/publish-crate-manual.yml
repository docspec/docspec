name: Publish crate (manual)

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish"
        required: true
        type: choice
        options:
          - docspec
          - docspec-core
          - docspec-json
          - docspec-markdown-reader
          - docspec-html-reader
          - docspec-blocknote-writer
          - docspec-cli
          - docspec-http

permissions:
  contents: read

jobs:
  publish:
    name: "Publish ${{ inputs.crate }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p "${{ inputs.crate }}"
